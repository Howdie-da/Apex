databases:
  - name: apex-db
    databaseName: apex
    user: apex_user
    plan: free
    region: oregon

services:
  - type: web
    name: apex-server
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: apex-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false

  - type: web
    name: apex-client
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build -w client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
